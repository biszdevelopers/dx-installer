name: Package manager integration

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  windows-manager-install:
    name: Install SQLite through Chocolatey on Windows amd64
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build a temporary Windows bootstrap executable
        shell: pwsh
        run: go build -trimpath -buildvcs=false -o "$env:RUNNER_TEMP\dx-bootstrap.exe" ./cmd/bootstrap

      - name: Install SQLite through Chocolatey and verify it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Get-Command choco -ErrorAction SilentlyContinue) {
            $chocoList = choco list --limit-output 2>$null
            $chocoPackages = @('sqlite', 'sqlite.install', 'sqlite.portable') | Where-Object { $chocoList -match "(?im)^$([regex]::Escape($_))\|" }
            foreach ($package in $chocoPackages) {
              choco uninstall $package --yes --no-progress
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
          Get-Command sqlite3 -All -ErrorAction SilentlyContinue |
            Where-Object { $_.CommandType -eq 'Application' -and $_.Source -and (Test-Path -LiteralPath $_.Source) } |
            ForEach-Object { Remove-Item -LiteralPath $_.Source -Force }

          $bootstrap = Join-Path $env:RUNNER_TEMP 'dx-bootstrap.exe'
          $approvals = (1..8 | ForEach-Object { 'y' }) -join "`n"
          $approvals | & $bootstrap install --tools sqlite --yes --manager chocolatey
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sqlite = Get-Command sqlite3 -ErrorAction SilentlyContinue
          if (-not $sqlite) { throw 'SQLite CLI was not added to PATH after the Chocolatey install.' }
          & $sqlite.Source --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  windows-seven-zip-install:
    name: Install 7-Zip through ${{ matrix.manager }} on Windows amd64
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        manager: [winget, scoop]
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build a temporary Windows bootstrap executable
        shell: pwsh
        run: go build -trimpath -buildvcs=false -o "$env:RUNNER_TEMP\dx-bootstrap.exe" ./cmd/bootstrap

      - name: Install through the selected existing package manager and verify it
        shell: pwsh
        env:
          PACKAGE_MANAGER: ${{ matrix.manager }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:PACKAGE_MANAGER -eq 'scoop') {
            $env:SCOOP = Join-Path $env:RUNNER_TEMP 'scoop'
            Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
            irm get.scoop.sh | iex
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          $wingetList = winget list --id 7zip.7zip --exact --source winget 2>$null | Out-String
          if ($LASTEXITCODE -eq 0 -and $wingetList -match '7zip\.7zip') {
            winget uninstall --id 7zip.7zip --exact --silent --source winget
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (Get-Command choco -ErrorAction SilentlyContinue) {
            $chocoList = choco list --limit-output 2>$null
            $chocoPackages = @('7zip.install', '7zip.portable') | Where-Object { $chocoList -match "(?im)^$([regex]::Escape($_))\|" }
            foreach ($package in $chocoPackages) {
              choco uninstall $package --yes --no-progress
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
          if (Get-Command scoop -ErrorAction SilentlyContinue) {
            $scoopList = scoop list 2>$null | Out-String
            if ($scoopList -match '(?im)^\s*7zip\s') {
              scoop uninstall 7zip
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
          Get-Command 7z -All -ErrorAction SilentlyContinue |
            Where-Object { $_.CommandType -eq 'Application' -and $_.Source -and (Test-Path -LiteralPath $_.Source) } |
            ForEach-Object { Remove-Item -LiteralPath $_.Source -Force }

          $wingetInventory = Join-Path $env:RUNNER_TEMP 'winget-inventory.json'
          winget export --output $wingetInventory --include-versions --accept-source-agreements --disable-interactivity | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Could not initialize WinGet source agreements for the integration test.' }

          $bootstrap = Join-Path $env:RUNNER_TEMP 'dx-bootstrap.exe'
          $approvals = (1..8 | ForEach-Object { 'y' }) -join "`n"
          $approvals | & $bootstrap install --tools seven-zip --yes --manager $env:PACKAGE_MANAGER
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:PACKAGE_MANAGER -eq 'scoop') {
            $sevenZip = Join-Path $env:SCOOP 'apps\7zip\current\7z.exe'
          } else {
            $sevenZip = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
          }
          if (-not (Test-Path -LiteralPath $sevenZip -PathType Leaf)) {
            throw "7-Zip was not installed at the expected package path: $sevenZip"
          }
          & $sevenZip i
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  macos-manager-install:
    name: Install through Homebrew on macOS ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            architecture: amd64
          - runner: macos-15
            architecture: arm64
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build a temporary macOS bootstrap executable
        run: go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/dx-bootstrap" ./cmd/bootstrap

      - name: Install OpenOCD through Homebrew and verify it
        run: |
          printf 'yes\n' | "$RUNNER_TEMP/dx-bootstrap" install --tools openocd --yes --manager homebrew
          openocd --version

  linux-manager-install:
    name: Install through ${{ matrix.manager }} in ${{ matrix.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:trixie-slim
            manager: apt
            prepare: apt-get update
          - image: fedora:latest
            manager: dnf
            prepare: dnf makecache
          - image: rockylinux:8
            manager: yum
            prepare: yum makecache
          - image: archlinux:latest
            manager: pacman
            prepare: pacman-key --init && pacman-key --populate archlinux && pacman -Sy --noconfirm
          - image: opensuse/tumbleweed:latest
            manager: zypper
            prepare: zypper --gpg-auto-import-keys --non-interactive refresh
          - image: alpine:latest
            manager: apk
            prepare: apk update
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build a temporary Linux bootstrap executable
        env:
          CGO_ENABLED: 0
        run: go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/dx-bootstrap" ./cmd/bootstrap

      - name: Install Ninja in a disposable distribution container
        env:
          CONTAINER_IMAGE: ${{ matrix.image }}
          PACKAGE_MANAGER: ${{ matrix.manager }}
          MANAGER_SETUP: ${{ matrix.prepare }}
        run: |
          printf 'y\n' | docker run --rm -i \
            --volume "$RUNNER_TEMP/dx-bootstrap:/dx-bootstrap:ro" \
            "$CONTAINER_IMAGE" sh -eu -c "$MANAGER_SETUP; /dx-bootstrap install --tools ninja --yes --manager $PACKAGE_MANAGER"

  freebsd-manager-install:
    name: Install through FreeBSD pkg in a FreeBSD 15.1 VM
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Cross-build a FreeBSD amd64 bootstrap executable
        env:
          CGO_ENABLED: 0
          GOOS: freebsd
          GOARCH: amd64
        run: |
          mkdir -p .integration
          go build -trimpath -buildvcs=false -o .integration/dx-bootstrap-freebsd ./cmd/bootstrap

      - name: Install Ninja through pkg and verify it on FreeBSD
        uses: vmactions/freebsd-vm@v1.5.9
        with:
          release: '15.1'
          sync: rsync
          copyback: false
          disable-cache: true
          prepare: |
            pkg bootstrap -y
            pkg update -f
          run: |
            set -eu
            printf 'y\n' | ./.integration/dx-bootstrap-freebsd install --tools ninja --yes --manager freebsd-pkg
