name: Package manager integration

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  windows-manager-install:
    name: Install SQLite through Chocolatey on Windows amd64
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build a temporary Windows bootstrap executable
        shell: pwsh
        run: go build -trimpath -buildvcs=false -o "$env:RUNNER_TEMP\dx-bootstrap.exe" ./cmd/bootstrap

      - name: Install SQLite through Chocolatey and verify it
        shell: pwsh
        run: |
          $bootstrap = Join-Path $env:RUNNER_TEMP 'dx-bootstrap.exe'
          $approvals = (1..8 | ForEach-Object { 'y' }) -join "`n"
          $approvals | & $bootstrap install --tools sqlite --yes --manager chocolatey
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          sqlite3 --version

  macos-manager-install:
    name: Install through Homebrew on macOS ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            architecture: amd64
          - runner: macos-15
            architecture: arm64
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build a temporary macOS bootstrap executable
        run: go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/dx-bootstrap" ./cmd/bootstrap

      - name: Install OpenOCD through Homebrew and verify it
        run: |
          printf 'yes\n' | "$RUNNER_TEMP/dx-bootstrap" install --tools openocd --yes --manager homebrew
          openocd --version

  linux-manager-install:
    name: Install through ${{ matrix.manager }} in ${{ matrix.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:trixie-slim
            manager: apt
            prepare: apt-get update
          - image: fedora:latest
            manager: dnf
            prepare: dnf makecache
          - image: archlinux:latest
            manager: pacman
            prepare: pacman-key --init && pacman-key --populate archlinux && pacman -Sy --noconfirm
          - image: opensuse/tumbleweed:latest
            manager: zypper
            prepare: zypper --gpg-auto-import-keys --non-interactive refresh
          - image: alpine:latest
            manager: apk
            prepare: apk update
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build a temporary Linux bootstrap executable
        env:
          CGO_ENABLED: 0
        run: go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/dx-bootstrap" ./cmd/bootstrap

      - name: Install Ninja in a disposable distribution container
        env:
          CONTAINER_IMAGE: ${{ matrix.image }}
          PACKAGE_MANAGER: ${{ matrix.manager }}
          MANAGER_SETUP: ${{ matrix.prepare }}
        run: |
          printf 'y\n' | docker run --rm -i \
            --volume "$RUNNER_TEMP/dx-bootstrap:/dx-bootstrap:ro" \
            "$CONTAINER_IMAGE" sh -eu -c "$MANAGER_SETUP; /dx-bootstrap install --tools ninja --yes --manager $PACKAGE_MANAGER"

  freebsd-manager-install:
    name: Install through FreeBSD pkg in a FreeBSD 15.1 VM
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Cross-build a FreeBSD amd64 bootstrap executable
        env:
          CGO_ENABLED: 0
          GOOS: freebsd
          GOARCH: amd64
        run: |
          mkdir -p .integration
          go build -trimpath -buildvcs=false -o .integration/dx-bootstrap-freebsd ./cmd/bootstrap

      - name: Install Ninja through pkg and verify it on FreeBSD
        uses: vmactions/freebsd-vm@v1.5.9
        with:
          release: '15.1'
          sync: rsync
          copyback: false
          disable-cache: true
          prepare: |
            pkg bootstrap -y
            pkg update -f
          run: |
            set -eu
            printf 'y\n' | ./.integration/dx-bootstrap-freebsd install --tools ninja --yes --manager freebsd-pkg
