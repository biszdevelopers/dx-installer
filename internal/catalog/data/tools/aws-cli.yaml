schema_version: 1
id: aws-cli
name: AWS CLI
category: devops.cloud
description: Official command-line interface for Amazon Web Services.
tags: [aws, cloud, devops]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [aws]
version_args: [--version]
dependencies: []
conflicts: []
platforms:
  macos: [arm64]
  windows: [amd64]
  linux: [amd64, arm64]
installers:
  - platform: linux
    manager: homebrew
    package_id: awscli
    scope: user
    source: homebrew-core
  - platform: windows
    manager: scoop
    package_id: aws
    scope: user
    source: Scoop Main bucket
    architectures: [amd64]
  - platform: macos
    manager: homebrew
    package_id: awscli
    scope: user
    source: homebrew-core
