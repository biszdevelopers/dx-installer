schema_version: 1
id: cargo-watch
name: cargo-watch
category: rust.development
description: Watches Rust project files and runs Cargo commands when they change.
tags: [rust, automation, cargo]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [cargo]
version_args: [watch, --version]
dependencies: [rustup]
conflicts: []
platforms:
  windows: [amd64, arm64]
  macos: [amd64, arm64]
  linux: [amd64, arm64]
registry_installers:
  - platform: windows
    ecosystem: cargo
    package_id: cargo-watch
    version: 8.5.3
    scope: user
    source: https://index.crates.io/
  - platform: macos
    ecosystem: cargo
    package_id: cargo-watch
    version: 8.5.3
    scope: user
    source: https://index.crates.io/
  - platform: linux
    ecosystem: cargo
    package_id: cargo-watch
    version: 8.5.3
    scope: user
    source: https://index.crates.io/
