schema_version: 1
id: changesets-cli
name: Changesets CLI
category: javascript.release
description: Version and changelog management for JavaScript monorepositories.
tags: [javascript, monorepo, release]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [changeset]
version_args: [--version]
dependencies: [nodejs-lts]
conflicts: []
platforms:
  windows: [amd64, arm64]
  macos: [amd64, arm64]
  linux: [amd64, arm64]
registry_installers:
  - platform: windows
    ecosystem: npm
    package_id: '@changesets/cli'
    version: 3.0.3
    scope: user
    source: https://registry.npmjs.org/
  - platform: macos
    ecosystem: npm
    package_id: '@changesets/cli'
    version: 3.0.3
    scope: user
    source: https://registry.npmjs.org/
  - platform: linux
    ecosystem: npm
    package_id: '@changesets/cli'
    version: 3.0.3
    scope: user
    source: https://registry.npmjs.org/
