schema_version: 1
id: mingw-w64
name: MinGW-w64
category: cpp.compiler
description: GCC, G++, GDB, GNU Make, and binutils for building Windows programs from supported hosts.
tags: [cpp, gcc, windows, compiler, debugger]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [gcc, g++, gdb, make]
version_args: [--version]
dependencies: []
conflicts: []
platforms:
  windows: [amd64]
  macos: [amd64, arm64]
  linux: [amd64, arm64]
installers:
  - platform: macos
    manager: homebrew
    package_id: mingw-w64
    scope: user
    source: homebrew-core
  - platform: linux
    manager: homebrew
    package_id: mingw-w64
    scope: user
    source: homebrew-core
  - platform: windows
    manager: scoop
    package_id: mingw
    scope: user
    source: Scoop Main bucket
