schema_version: 1
id: pixi
name: Pixi
category: python.package-manager
description: Cross-platform environment and package manager for Python and other developer tooling.
tags: [python, package-management, environments]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [pixi]
version_args: [--version]
dependencies: []
conflicts: []
platforms:
  macos: [arm64]
  linux: [amd64, arm64]
installers:
  - platform: macos
    manager: homebrew
    package_id: pixi
    scope: user
    source: homebrew-core
  - platform: linux
    manager: homebrew
    package_id: pixi
    scope: user
    source: homebrew-core
