schema_version: 1
id: python
name: Python 3
category: python.runtime
description: Python programming language runtime. Existing operating-system Python installations are preserved.
tags: [python, runtime]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [python3, python, py]
version_args: [--version]
dependencies: []
conflicts: []
platforms:
  windows: [amd64, arm64]
  macos: [amd64, arm64]
  linux: [amd64, arm64]
installers:
  - platform: windows
    manager: winget
    package_id: Python.Python.3.14
    scope: user
    source: winget
  - platform: macos
    manager: homebrew
    package_id: python
    scope: user
    source: homebrew-core
