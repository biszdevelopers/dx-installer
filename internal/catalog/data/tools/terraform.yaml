schema_version: 1
id: terraform
name: Terraform
category: devops.infrastructure
description: HashiCorp infrastructure-as-code CLI from its official Homebrew tap; the tap may be added by Homebrew after approval.
tags: [infrastructure, devops, hashicorp]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [terraform]
version_args: [version]
dependencies: []
conflicts: []
platforms:
  macos: [amd64, arm64]
  linux: [amd64, arm64]
installers:
  - platform: macos
    manager: homebrew
    package_id: hashicorp/tap/terraform
    scope: user
    source: hashicorp-homebrew-tap
  - platform: linux
    manager: homebrew
    package_id: hashicorp/tap/terraform
    scope: user
    source: hashicorp-homebrew-tap
