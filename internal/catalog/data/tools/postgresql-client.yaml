schema_version: 1
id: postgresql-client
name: PostgreSQL Client
category: database.client
description: PostgreSQL command-line client for connecting to PostgreSQL database servers.
tags: [database, postgresql, sql, client]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [psql]
version_args: [--version]
dependencies: []
conflicts: []
platforms:
  windows: [amd64]
  macos: [amd64, arm64]
  linux: [amd64, arm64]
artifacts:
  - platform: windows
    architecture: amd64
    version: 18.6-5
    url: https://get.enterprisedb.com/postgresql/postgresql-18.6-5-windows-x64-binaries.zip
    sha256: e2246ba91d22345bc3d017586c09ede52d9df180b1eeb480f050445f1cad84e2
    installation_note: Includes command-line tools and server binaries; DX does not initialize or start a database service.
    max_download_bytes: 2147483648
    max_expanded_bytes: 8589934592
    format: zip
    archive_root: pgsql
    path_entries: [bin]
    allowed_redirect_hosts: [get.enterprisedb.com]
installers:
  - platform: macos
    manager: homebrew
    package_id: libpq
    scope: user
    source: homebrew-core
    path_entries: [bin]
  - platform: linux
    manager: apt
    package_id: postgresql-client
    scope: system
    source: configured-apt-repositories
  - platform: linux
    manager: homebrew
    package_id: libpq
    scope: user
    source: homebrew-core
    path_entries: [bin]
