schema_version: 1
id: virtualenv
name: virtualenv
category: python.environments
description: Creates isolated Python environments.
tags: [python, environments]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [virtualenv]
version_args: [--version]
dependencies: [python, uv]
conflicts: []
platforms:
  windows: [amd64, arm64]
  macos: [amd64, arm64]
  linux: [amd64, arm64]
registry_installers:
  - platform: windows
    ecosystem: pypi
    package_id: virtualenv
    version: 21.15.2
    scope: user
    source: https://pypi.org/simple/
  - platform: macos
    ecosystem: pypi
    package_id: virtualenv
    version: 21.15.2
    scope: user
    source: https://pypi.org/simple/
  - platform: linux
    ecosystem: pypi
    package_id: virtualenv
    version: 21.15.2
    scope: user
    source: https://pypi.org/simple/