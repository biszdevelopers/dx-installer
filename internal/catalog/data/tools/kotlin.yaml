schema_version: 1
id: kotlin
name: Kotlin
category: kotlin.compiler
description: Statically typed programming language designed to interoperate with Java.
tags: [kotlin, jvm, compiler]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [kotlinc]
version_args: [-version]
dependencies: []
conflicts: []
platforms:
  macos: [arm64]
  linux: [amd64, arm64]
installers:
  - platform: macos
    manager: homebrew
    package_id: kotlin
    scope: user
    source: homebrew-core
  - platform: linux
    manager: apt
    package_id: kotlin
    scope: system
    source: configured-apt-repositories
