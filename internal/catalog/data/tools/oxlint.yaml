schema_version: 1
id: oxlint
name: oxlint
category: javascript.quality
description: Fast JavaScript and TypeScript linter from Oxc.
tags: [javascript, typescript, linter]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [oxlint]
version_args: [--version]
dependencies: [nodejs-lts]
conflicts: []
platforms:
  windows: [amd64, arm64]
  macos: [arm64]
  linux: [amd64, arm64]
installers:
  - platform: macos
    manager: homebrew
    package_id: oxlint
    scope: user
    source: homebrew-core
  - platform: linux
    manager: homebrew
    package_id: oxlint
    scope: user
    source: homebrew-core
registry_installers:
  - platform: windows
    ecosystem: npm
    package_id: oxlint
    version: 1.89.0
    scope: user
    source: https://registry.npmjs.org/
  - platform: macos
    ecosystem: npm
    package_id: oxlint
    version: 1.89.0
    scope: user
    source: https://registry.npmjs.org/
  - platform: linux
    ecosystem: npm
    package_id: oxlint
    version: 1.89.0
    scope: user
    source: https://registry.npmjs.org/
