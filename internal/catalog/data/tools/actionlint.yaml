schema_version: 1
id: actionlint
name: actionlint
category: quality.ci
description: Static checker for GitHub Actions workflow files.
tags: [github-actions, ci, lint]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [actionlint]
version_args: [--version]
dependencies: []
conflicts: []
platforms:
  macos: [amd64, arm64]
  windows: [amd64, arm64]
  linux: [amd64, arm64]
installers:
  - platform: linux
    manager: homebrew
    package_id: actionlint
    scope: user
    source: homebrew-core
  - platform: windows
    manager: scoop
    package_id: actionlint
    scope: user
    source: Scoop Main bucket
    architectures: [amd64, arm64]
  - platform: macos
    manager: homebrew
    package_id: actionlint
    scope: user
    source: homebrew-core
