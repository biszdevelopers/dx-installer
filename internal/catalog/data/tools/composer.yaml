schema_version: 1
id: composer
name: Composer
category: php.package-manager
description: Dependency manager for PHP projects.
tags: [php, package-management]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [composer]
version_args: [--version]
dependencies: [php]
conflicts: []
platforms:
  macos: [arm64]
  linux: [amd64, arm64]
installers:
  - platform: macos
    manager: homebrew
    package_id: composer
    scope: user
    source: homebrew-core
  - platform: linux
    manager: homebrew
    package_id: composer
    scope: user
    source: homebrew-core
