schema_version: 1
id: esbuild
name: esbuild
category: javascript.build
description: Fast JavaScript bundler and minifier.
tags: [javascript, typescript, bundler]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [esbuild]
version_args: [--version]
dependencies: [nodejs-lts]
conflicts: []
platforms:
  windows: [amd64, arm64]
  macos: [amd64, arm64]
  linux: [amd64, arm64]
installers:
  - platform: macos
    manager: homebrew
    package_id: esbuild
    scope: user
    source: homebrew-core
  - platform: linux
    manager: homebrew
    package_id: esbuild
    scope: user
    source: homebrew-core
registry_installers:
  - platform: windows
    ecosystem: npm
    package_id: esbuild
    version: 0.28.2
    scope: user
    source: https://registry.npmjs.org/
  - platform: macos
    ecosystem: npm
    package_id: esbuild
    version: 0.28.2
    scope: user
    source: https://registry.npmjs.org/
  - platform: linux
    ecosystem: npm
    package_id: esbuild
    version: 0.28.2
    scope: user
    source: https://registry.npmjs.org/
