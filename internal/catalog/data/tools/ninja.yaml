schema_version: 1
id: ninja
name: Ninja
category: cpp.build-system
description: Small, fast build system for projects with generated build files.
tags: [c, cpp, build]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [ninja]
version_args: [--version]
dependencies: []
conflicts: []
platforms:
  windows: [amd64, arm64]
  macos: [amd64, arm64]
  linux: [amd64, arm64]
  bsd: [amd64, arm64]
installers:
  - platform: windows
    manager: winget
    package_id: Ninja-build.Ninja
    scope: user
    source: winget
  - platform: windows
    manager: scoop
    package_id: ninja
    scope: user
    source: scoop-bucket
  - platform: macos
    manager: homebrew
    package_id: ninja
    scope: user
    source: homebrew-core
  - platform: linux
    manager: apt
    package_id: ninja-build
    scope: system
    source: configured-apt-repositories
  - platform: linux
    manager: dnf
    package_id: ninja-build
    scope: system
    source: configured-dnf-repositories
  - platform: linux
    manager: yum
    package_id: ninja-build
    scope: system
    source: configured-yum-repositories
  - platform: linux
    manager: pacman
    package_id: ninja
    scope: system
    source: configured-pacman-repositories
  - platform: linux
    manager: zypper
    package_id: ninja
    scope: system
    source: configured-zypper-repositories
  - platform: linux
    manager: apk
    package_id: ninja
    scope: system
    source: configured-apk-repositories
  - platform: bsd
    manager: freebsd-pkg
    package_id: ninja
    scope: system
    source: configured-freebsd-repository
