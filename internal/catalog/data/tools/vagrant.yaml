schema_version: 1
id: vagrant
name: Vagrant
category: devops.virtualization
description: Command-line environment manager for virtual machines; does not install a provider or start machines.
tags: [devops, virtualization, environments]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [vagrant]
version_args: [--version]
dependencies: []
conflicts: []
platforms:
  macos: [amd64, arm64]
  windows: [amd64]
  linux: [amd64]
installers:
  - platform: windows
    manager: winget
    package_id: Hashicorp.Vagrant
    scope: user
    source: winget
  - platform: macos
    manager: homebrew
    package_id: vagrant
    kind: cask
    scope: user
    source: homebrew-cask
  - platform: linux
    manager: homebrew
    package_id: hashicorp/tap/hashicorp-vagrant
    scope: user
    source: hashicorp/tap (official HashiCorp Homebrew tap)
    architectures: [amd64]
