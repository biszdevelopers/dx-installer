schema_version: 1
id: sbt
name: sbt
category: scala.build
description: Scala build tool.
tags: [scala, jvm, build]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [sbt]
version_args: [--version]
dependencies: [openjdk-21]
conflicts: []
platforms:
  macos: [arm64]
  linux: [amd64, arm64]
  windows: [amd64]
installers:
  - platform: windows
    manager: scoop
    package_id: sbt
    scope: user
    source: Scoop Main bucket
    architectures: [amd64]
  - platform: macos
    manager: homebrew
    package_id: sbt
    scope: user
    source: homebrew-core
  - platform: linux
    manager: homebrew
    package_id: sbt
    scope: user
    source: homebrew-core
