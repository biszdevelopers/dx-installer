schema_version: 1
id: redocly-cli
name: Redocly CLI
category: api.openapi
description: Lint, bundle, and manage OpenAPI definitions, including legacy Swagger 2.0 documents.
tags: [api, openapi, swagger, linting]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [redocly]
version_args: [--version]
dependencies: [nodejs-lts]
conflicts: []
platforms:
  windows: [amd64, arm64]
  macos: [amd64, arm64]
  linux: [amd64, arm64]
registry_installers:
  - platform: windows
    ecosystem: npm
    package_id: '@redocly/cli'
    version: 2.72.1
    scope: user
    source: https://registry.npmjs.org/
  - platform: macos
    ecosystem: npm
    package_id: '@redocly/cli'
    version: 2.72.1
    scope: user
    source: https://registry.npmjs.org/
  - platform: linux
    ecosystem: npm
    package_id: '@redocly/cli'
    version: 2.72.1
    scope: user
    source: https://registry.npmjs.org/
