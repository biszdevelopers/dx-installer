description: Git-compatible distributed version control system.
tags: [git, jujutsu, version-control]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [jj]
version_args: [--version]
dependencies: []
conflicts: []
platforms:
  macos: [arm64]
  linux: [amd64, arm64]
installers:
  - platform: macos
    manager: homebrew
    package_id: jj
    scope: user
    source: homebrew-core
  - platform: linux
    manager: homebrew
    package_id: jj
    scope: user
    source: homebrew-core
