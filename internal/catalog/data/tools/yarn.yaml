schema_version: 1
id: yarn
name: Yarn Classic
category: javascript.package-manager
description: Yarn 1.x package manager for JavaScript projects; requires Node.js.
tags: [javascript, nodejs, package-manager]
version:
  channel: classic
  upgrade_policy: never_automatically
executables: [yarn]
version_args: [--version]
dependencies: [nodejs-lts]
conflicts: []
platforms:
  macos: [amd64, arm64]
  windows: [amd64, arm64]
  linux: [amd64, arm64]
installers:
  - platform: windows
    manager: scoop
    package_id: yarn
    scope: user
    source: Scoop Main bucket
    architectures: [amd64]
  - platform: macos
    manager: homebrew
    package_id: yarn
    scope: user
    source: homebrew-core
registry_installers:
  - platform: windows
    ecosystem: npm
    package_id: yarn
    version: 1.22.22
    scope: user
    source: https://registry.npmjs.org/
  - platform: macos
    ecosystem: npm
    package_id: yarn
    version: 1.22.22
    scope: user
    source: https://registry.npmjs.org/
  - platform: linux
    ecosystem: npm
    package_id: yarn
    version: 1.22.22
    scope: user
    source: https://registry.npmjs.org/
