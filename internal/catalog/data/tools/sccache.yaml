schema_version: 1
id: sccache
name: sccache
category: cpp.build
description: Compiler cache wrapper for supported compiler toolchains.
tags: [c, cpp, compiler, cache, rust]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [sccache]
version_args: [--version]
dependencies: []
conflicts: []
platforms:
  macos: [arm64]
  linux: [amd64, arm64]
  windows: [amd64, arm64]
installers:
  - platform: windows
    manager: scoop
    package_id: sccache
    scope: user
    source: Scoop Main bucket
    architectures: [amd64, arm64]
  - platform: macos
    manager: homebrew
    package_id: sccache
    scope: user
    source: homebrew-core
  - platform: linux
    manager: homebrew
    package_id: sccache
    scope: user
    source: homebrew-core
