schema_version: 1
id: cpanminus
name: cpanminus
category: perl.package-manager
description: Lightweight CPAN client for installing Perl modules when explicitly requested.
tags: [perl, cpan, package-manager]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [cpanm]
version_args: [--version]
dependencies: [perl]
conflicts: []
platforms:
  linux: [amd64, arm64]
platform_alternatives:
  windows:
    - tool_id: perl
      architectures: [amd64]
      reason: Perl includes the CPAN client, which installs modules through the cpan command but does not have the cpanminus interface.
  macos:
    - tool_id: perl
      reason: Perl includes the CPAN client, which installs modules through the cpan command but does not have the cpanminus interface.
installers:
  - platform: linux
    manager: apt
    package_id: cpanminus
    scope: system
    source: configured-apt-repositories
  - platform: linux
    manager: dnf
    package_id: perl-App-cpanminus
    scope: system
    source: configured-dnf-repositories
