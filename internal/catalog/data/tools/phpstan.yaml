schema_version: 1
id: phpstan
name: PHPStan
category: php.quality
description: Static analysis tool for PHP.
tags: [php, static-analysis]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [phpstan]
version_args: [--version]
dependencies: [php]
conflicts: []
platforms:
  macos: [arm64]
  linux: [amd64, arm64]
installers:
  - platform: macos
    manager: homebrew
    package_id: phpstan
    scope: user
    source: homebrew-core
  - platform: linux
    manager: homebrew
    package_id: phpstan
    scope: user
    source: homebrew-core
