schema_version: 1
id: biome
name: Biome
category: javascript.quality
description: Web development toolchain for formatting and linting.
tags: [javascript, typescript, formatter, linter]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [biome]
version_args: [--version]
dependencies: [nodejs-lts]
conflicts: []
platforms:
  windows: [amd64, arm64]
  macos: [arm64]
  linux: [amd64, arm64]
installers:
  - platform: macos
    manager: homebrew
    package_id: biome
    scope: user
    source: homebrew-core
  - platform: linux
    manager: homebrew
    package_id: biome
    scope: user
    source: homebrew-core
registry_installers:
  - platform: windows
    ecosystem: npm
    package_id: '@biomejs/biome'
    version: 2.6.4
    scope: user
    source: https://registry.npmjs.org/
  - platform: macos
    ecosystem: npm
    package_id: '@biomejs/biome'
    version: 2.6.4
    scope: user
    source: https://registry.npmjs.org/
  - platform: linux
    ecosystem: npm
    package_id: '@biomejs/biome'
    version: 2.6.4
    scope: user
    source: https://registry.npmjs.org/
