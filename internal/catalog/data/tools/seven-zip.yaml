schema_version: 1
id: seven-zip
name: 7-Zip
category: system.archive
description: File archiver required to extract the Zephyr SDK archive on Windows.
tags: [archive, extractor, windows]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [7z]
version_args: [i]
dependencies: []
conflicts: []
platforms:
  windows: [amd64]
installers:
  - platform: windows
    manager: winget
    package_id: 7zip.7zip
    scope: system
    source: winget
  - platform: windows
    manager: scoop
    package_id: 7zip
    scope: user
    source: scoop-bucket
