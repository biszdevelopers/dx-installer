schema_version: 1
id: groovy
name: Groovy
category: groovy.runtime
description: Java-based scripting language and compiler.
tags: [groovy, jvm, language]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [groovy, groovyc]
version_args: [--version]
dependencies: [openjdk-21]
conflicts: []
platforms:
  macos: [arm64]
  linux: [amd64, arm64]
  windows: [amd64]
installers:
  - platform: windows
    manager: scoop
    package_id: groovy
    scope: user
    source: Scoop Main bucket
    architectures: [amd64]
  - platform: macos
    manager: homebrew
    package_id: groovy
    scope: user
    source: homebrew-core
  - platform: linux
    manager: homebrew
    package_id: groovy
    scope: user
    source: homebrew-core
