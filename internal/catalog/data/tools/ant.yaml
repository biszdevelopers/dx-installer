schema_version: 1
id: ant
name: Apache Ant
category: java.build
description: Java library and application build tool.
tags: [java, jvm, build]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [ant]
version_args: [-version]
dependencies: [openjdk-27]
conflicts: []
platforms:
  macos: [arm64]
  linux: [amd64, arm64]
installers:
  - platform: macos
    manager: homebrew
    package_id: ant
    scope: user
    source: homebrew-core
  - platform: linux
    manager: homebrew
    package_id: ant
    scope: user
    source: homebrew-core
