schema_version: 1
id: leiningen
name: Leiningen
category: clojure.build
description: Clojure project automation and build tool.
tags: [clojure, jvm, build]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [lein]
version_args: [--version]
dependencies: [openjdk-27]
conflicts: []
platforms:
  macos: [arm64]
  linux: [amd64, arm64]
installers:
  - platform: macos
    manager: homebrew
    package_id: leiningen
    scope: user
    source: homebrew-core
  - platform: linux
    manager: homebrew
    package_id: leiningen
    scope: user
    source: homebrew-core
