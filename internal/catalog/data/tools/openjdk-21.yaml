schema_version: 1
id: openjdk-21
name: OpenJDK 21
category: java.runtime
description: OpenJDK 21 development kit for projects that require the Java 21 toolchain.
tags: [java, jdk, openjdk]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [java, javac]
version_args: [-version]
dependencies: []
conflicts: []
platforms:
  windows: [amd64, arm64]
  macos: [amd64, arm64]
  linux: [amd64, arm64]
installers:
  - platform: windows
    manager: winget
    package_id: EclipseAdoptium.Temurin.21.JDK
    scope: system
    source: winget
  - platform: macos
    manager: homebrew
    package_id: temurin@21
    kind: cask
    scope: user
    source: homebrew-cask
  - platform: linux
    manager: homebrew
    package_id: openjdk@21
    scope: user
    source: homebrew-core
    path_entries: [bin]
