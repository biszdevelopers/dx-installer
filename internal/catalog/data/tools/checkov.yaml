schema_version: 1
id: checkov
name: Checkov
category: security.iac
description: Static analysis for infrastructure-as-code configurations.
tags: [security, iac, quality]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [checkov]
version_args: [--version]
dependencies: [python, uv]
conflicts: []
platforms:
  windows: [amd64, arm64]
  macos: [amd64, arm64]
  linux: [amd64, arm64]
installers:
  - platform: linux
    manager: homebrew
    package_id: checkov
    scope: user
    source: homebrew-core
  - platform: macos
    manager: homebrew
    package_id: checkov
    scope: user
    source: homebrew-core
registry_installers:
  - platform: windows
    ecosystem: pypi
    package_id: checkov
    version: 3.3.11
    scope: user
    source: https://pypi.org/simple/
  - platform: macos
    ecosystem: pypi
    package_id: checkov
    version: 3.3.11
    scope: user
    source: https://pypi.org/simple/
  - platform: linux
    ecosystem: pypi
    package_id: checkov
    version: 3.3.11
    scope: user
    source: https://pypi.org/simple/
