schema_version: 1
id: lld
name: LLD
category: cpp.linker
description: LLVM linker tools for ELF, Mach-O, COFF, and WebAssembly.
tags: [c, cpp, linker, llvm]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [ld.lld]
version_args: [--version]
dependencies: [clang]
conflicts: []
platforms:
  windows: [amd64, arm64]
  macos: [amd64, arm64]
  linux: [amd64, arm64]
installers:
  - platform: windows
    manager: scoop
    package_id: llvm
    scope: user
    source: Scoop Main bucket
    architectures: [amd64, arm64]
  - platform: macos
    manager: homebrew
    package_id: llvm
    scope: user
    source: homebrew-core
  - platform: linux
    manager: homebrew
    package_id: lld
    scope: user
    source: homebrew-core
