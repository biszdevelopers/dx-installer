schema_version: 1
id: cppcheck
name: Cppcheck
category: cpp.analysis
description: Static analysis tool for C and C++ code.
tags: [c, cpp, static-analysis]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [cppcheck]
version_args: [--version]
dependencies: []
conflicts: []
platforms:
  macos: [arm64]
  linux: [amd64, arm64]
  windows: [amd64]
installers:
  - platform: windows
    manager: scoop
    package_id: cppcheck
    scope: user
    source: Scoop Main bucket
    architectures: [amd64]
  - platform: macos
    manager: homebrew
    package_id: cppcheck
    scope: user
    source: homebrew-core
  - platform: linux
    manager: homebrew
    package_id: cppcheck
    scope: user
    source: homebrew-core
