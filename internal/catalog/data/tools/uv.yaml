schema_version: 1
id: uv
name: uv
category: python.package-manager
description: Fast Python package and project manager from Astral.
tags: [python, package-management, tooling]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [uv]
version_args: [--version]
dependencies: []
conflicts: []
platforms:
  windows: [amd64, arm64]
  macos: [amd64, arm64]
  linux: [amd64, arm64]
installers:
  - platform: windows
    manager: winget
    package_id: astral-sh.uv
    scope: user
    source: winget
  - platform: macos
    manager: homebrew
    package_id: uv
    scope: user
    source: homebrew-core
