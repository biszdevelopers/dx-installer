schema_version: 1
id: php
name: PHP
category: php.runtime
description: General-purpose scripting language suited to web development.
tags: [php, web, scripting]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [php]
version_args: [--version]
dependencies: []
conflicts: []
platforms:
  macos: [amd64, arm64]
  linux: [amd64, arm64]
installers:
  - platform: macos
    manager: homebrew
    package_id: php
    scope: user
    source: homebrew-core
  - platform: linux
    manager: apt
    package_id: php-cli
    scope: system
    source: configured-apt-repositories
