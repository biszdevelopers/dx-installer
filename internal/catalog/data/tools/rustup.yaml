schema_version: 1
id: rustup
name: Rustup
category: rust.toolchain
description: Official Rust toolchain installer and version manager.
tags: [rust, compiler, toolchain]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [rustup]
version_args: [--version]
dependencies: []
conflicts: []
platforms:
  windows: [amd64, arm64]
  macos: [amd64, arm64]
  linux: [amd64, arm64]
installers:
  - platform: windows
    manager: winget
    package_id: Rustlang.Rustup
    scope: user
    source: winget
  - platform: macos
    manager: homebrew
    package_id: rustup-init
    scope: user
    source: homebrew-core
  - platform: linux
    manager: apt
    package_id: rustup
    scope: system
    source: configured-apt-repositories
  - platform: linux
    manager: pacman
    package_id: rustup
    scope: system
    source: configured-pacman-repositories
