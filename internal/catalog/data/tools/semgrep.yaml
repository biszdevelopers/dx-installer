schema_version: 1
id: semgrep
name: Semgrep
category: security.analysis
description: Static analysis CLI for local code and configurable security rules; DX never scans projects automatically.
tags: [security, static-analysis, code-quality]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [semgrep]
version_args: [--version]
dependencies: [python, uv]
conflicts: []
platforms:
  windows: [amd64]
  macos: [arm64]
  linux: [amd64, arm64]
registry_installers:
  - platform: windows
    ecosystem: pypi
    package_id: semgrep
    version: 1.183.0
    scope: user
    source: https://pypi.org/simple/
  - platform: macos
    ecosystem: pypi
    package_id: semgrep
    version: 1.183.0
    scope: user
    source: https://pypi.org/simple/
  - platform: linux
    ecosystem: pypi
    package_id: semgrep
    version: 1.183.0
    scope: user
    source: https://pypi.org/simple/
