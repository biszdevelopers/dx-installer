schema_version: 1
id: arduino-cli
name: Arduino CLI
category: embedded.tooling
description: Arduino command-line interface for compiling sketches and managing board platforms.
tags: [embedded, arduino, boards]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [arduino-cli]
version_args: [version]
dependencies: []
conflicts: []
platforms:
  macos: [amd64, arm64]
  linux: [amd64, arm64]
installers:
  - platform: macos
    manager: homebrew
    package_id: arduino-cli
    scope: user
    source: homebrew-core
  - platform: linux
    manager: homebrew
    package_id: arduino-cli
    scope: user
    source: homebrew-core
