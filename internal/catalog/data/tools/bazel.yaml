schema_version: 1
id: bazel
name: Bazel
category: cpp.build
description: Google's extensible build and test system.
tags: [build, cpp, java, monorepo]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [bazel]
version_args: [--version]
dependencies: [openjdk-21]
conflicts: []
platforms:
  macos: [arm64]
  linux: [amd64, arm64]
  windows: [amd64]
installers:
  - platform: windows
    manager: scoop
    package_id: bazel
    scope: user
    source: Scoop Main bucket
    architectures: [amd64]
  - platform: macos
    manager: homebrew
    package_id: bazel
    scope: user
    source: homebrew-core
  - platform: linux
    manager: homebrew
    package_id: bazel
    scope: user
    source: homebrew-core
