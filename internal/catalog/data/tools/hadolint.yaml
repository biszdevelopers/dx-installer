schema_version: 1
id: hadolint
name: Hadolint
category: security.container
description: Linter for Dockerfiles with best-practice and shell analysis rules.
tags: [security, containers, lint]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [hadolint]
version_args: [--version]
dependencies: []
conflicts: []
platforms:
  macos: [amd64, arm64]
  linux: [amd64, arm64]
  windows: [amd64]
installers:
  - platform: windows
    manager: scoop
    package_id: hadolint
    scope: user
    source: Scoop Main bucket
    architectures: [amd64]
  - platform: macos
    manager: homebrew
    package_id: hadolint
    scope: user
    source: homebrew-core
  - platform: linux
    manager: homebrew
    package_id: hadolint
    scope: user
    source: homebrew-core
