schema_version: 1
id: r
name: R
category: r.runtime
description: Language and environment for statistical computing and graphics.
tags: [r, statistics, data-science]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [R]
version_args: [--version]
dependencies: []
conflicts: []
platforms:
  macos: [arm64]
  linux: [amd64, arm64]
installers:
  - platform: macos
    manager: homebrew
    package_id: r
    scope: user
    source: homebrew-core
  - platform: linux
    manager: apt
    package_id: r-base
    scope: system
    source: configured-apt-repositories
