schema_version: 1
id: prettier
name: Prettier
category: javascript.formatting
description: Opinionated code formatter for JavaScript, TypeScript, and related formats.
tags: [javascript, typescript, formatter]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [prettier]
version_args: [--version]
dependencies: [nodejs-lts]
conflicts: []
platforms:
  windows: [amd64, arm64]
  macos: [amd64, arm64]
  linux: [amd64, arm64]
registry_installers:
  - platform: windows
    ecosystem: npm
    package_id: prettier
    version: 3.9.10
    scope: user
    source: https://registry.npmjs.org/
  - platform: macos
    ecosystem: npm
    package_id: prettier
    version: 3.9.10
    scope: user
    source: https://registry.npmjs.org/
  - platform: linux
    ecosystem: npm
    package_id: prettier
    version: 3.9.10
    scope: user
    source: https://registry.npmjs.org/
