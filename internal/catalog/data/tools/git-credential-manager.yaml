schema_version: 1
id: git-credential-manager
name: Git Credential Manager
category: version-control.credentials
description: Cross-platform Git credential storage for hosting providers.
tags: [git, credentials, authentication]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [git-credential-manager]
version_args: [--version]
dependencies: [git]
conflicts: []
platforms:
  macos: [amd64, arm64]
  linux: [amd64, arm64]
platform_alternatives:
  windows:
    - tool_id: git
      reason: Git for Windows includes its own compatible Git Credential Manager version; it may not be the newest standalone release.
      architectures: [amd64, arm64]
installers:
  - platform: macos
    manager: homebrew
    package_id: git-credential-manager
    kind: cask
    scope: user
    source: homebrew-cask
  - platform: linux
    manager: homebrew
    package_id: git-credential-manager
    kind: cask
    scope: user
    source: homebrew-cask
    architectures: [amd64, arm64]
