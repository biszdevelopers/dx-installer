schema_version: 1
id: staticcheck
name: Staticcheck
category: go.quality
description: Go static analysis for bugs, performance issues, and style.
tags: [go, linter, static-analysis]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [staticcheck]
version_args: [--version]
dependencies: [go]
conflicts: []
platforms:
  windows: [amd64, arm64]
  macos: [amd64, arm64]
  linux: [amd64, arm64]
installers:
  - platform: macos
    manager: homebrew
    package_id: staticcheck
    scope: user
    source: homebrew-core
  - platform: linux
    manager: homebrew
    package_id: staticcheck
    scope: user
    source: homebrew-core
registry_installers:
  - platform: windows
    ecosystem: go-modules
    package_id: honnef.co/go/tools/cmd/staticcheck
    version: v0.8.2
    scope: user
    source: https://proxy.golang.org
  - platform: macos
    ecosystem: go-modules
    package_id: honnef.co/go/tools/cmd/staticcheck
    version: v0.8.2
    scope: user
    source: https://proxy.golang.org
  - platform: linux
    ecosystem: go-modules
    package_id: honnef.co/go/tools/cmd/staticcheck
    version: v0.8.2
    scope: user
    source: https://proxy.golang.org
