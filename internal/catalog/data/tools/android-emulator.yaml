schema_version: 1
id: android-emulator
name: Android Emulator
category: mobile.android
description: Google's Android Emulator runtime; virtual device images remain separately chosen in the Android SDK Manager.
tags: [android, sdk, mobile, emulator, virtualization]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [emulator]
version_args: [-version]
dependencies: [android-sdk-command-line-tools]
conflicts: []
platforms:
  windows: [amd64]
  macos: [amd64, arm64]
  linux: [amd64]
installers:
  - platform: windows
    manager: android-sdk
    package_id: emulator
    scope: user
    source: google-android-sdk (interactive license prompt)
    path_entries: [emulator]
    approximate_size: 419430400
  - platform: macos
    manager: android-sdk
    package_id: emulator
    scope: user
    source: google-android-sdk (interactive license prompt)
    path_entries: [emulator]
    approximate_size: 419430400
  - platform: linux
    manager: android-sdk
    package_id: emulator
    scope: user
    source: google-android-sdk (interactive license prompt)
    path_entries: [emulator]
    approximate_size: 419430400
