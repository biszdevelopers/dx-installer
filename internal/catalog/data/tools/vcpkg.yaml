schema_version: 1
id: vcpkg
name: vcpkg CLI
category: cpp.package-manager
description: Microsoft C++ dependency manager CLI; a checkout and VCPKG_ROOT are required for package operations.
tags: [cpp, c++, package-manager, dependencies]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [vcpkg]
version_args: [version]
dependencies: [git]
conflicts: []
platforms:
  macos: [amd64, arm64]
  linux: [amd64, arm64]
  windows: [amd64]
installers:
  - platform: windows
    manager: scoop
    package_id: vcpkg
    scope: user
    source: Scoop Main bucket
    architectures: [amd64]
  - platform: macos
    manager: homebrew
    package_id: vcpkg
    scope: user
    source: homebrew-core
  - platform: linux
    manager: homebrew
    package_id: vcpkg
    scope: user
    source: homebrew-core
