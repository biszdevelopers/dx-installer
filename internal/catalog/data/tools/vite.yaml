schema_version: 1
id: vite
name: Vite
category: javascript.development
description: Frontend development server and build tool.
tags: [javascript, typescript, build, frontend]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [vite]
version_args: [--version]
dependencies: [nodejs-lts]
conflicts: []
platforms:
  windows: [amd64, arm64]
  macos: [amd64, arm64]
  linux: [amd64, arm64]
installers:
  - platform: macos
    manager: homebrew
    package_id: vite
    scope: user
    source: homebrew-core
  - platform: linux
    manager: homebrew
    package_id: vite
    scope: user
    source: homebrew-core
registry_installers:
  - platform: windows
    ecosystem: npm
    package_id: vite
    version: 8.3.5
    scope: user
    source: https://registry.npmjs.org/
  - platform: macos
    ecosystem: npm
    package_id: vite
    version: 8.3.5
    scope: user
    source: https://registry.npmjs.org/
  - platform: linux
    ecosystem: npm
    package_id: vite
    version: 8.3.5
    scope: user
    source: https://registry.npmjs.org/
