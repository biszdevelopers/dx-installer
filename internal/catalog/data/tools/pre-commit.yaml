schema_version: 1
id: pre-commit
name: pre-commit
category: security.quality
description: Framework for managing multi-language Git hooks; does not install hooks into a repository automatically.
tags: [security, quality, git-hooks]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [pre-commit]
version_args: [--version]
dependencies: [python, uv]
conflicts: []
platforms:
  windows: [amd64, arm64]
  macos: [amd64, arm64]
  linux: [amd64, arm64]
installers:
  - platform: macos
    manager: homebrew
    package_id: pre-commit
    scope: user
    source: homebrew-core
  - platform: linux
    manager: homebrew
    package_id: pre-commit
    scope: user
    source: homebrew-core
registry_installers:
  - platform: windows
    ecosystem: pypi
    package_id: pre-commit
    version: 4.7.0
    scope: user
    source: https://pypi.org/simple/
  - platform: macos
    ecosystem: pypi
    package_id: pre-commit
    version: 4.7.0
    scope: user
    source: https://pypi.org/simple/
  - platform: linux
    ecosystem: pypi
    package_id: pre-commit
    version: 4.7.0
    scope: user
    source: https://pypi.org/simple/
