schema_version: 1
id: oxfmt
name: oxfmt
category: javascript.formatting
description: High-performance JavaScript and TypeScript formatter from Oxc.
tags: [javascript, typescript, formatter]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [oxfmt]
version_args: [--version]
dependencies: [nodejs-lts]
conflicts: []
platforms:
  macos: [arm64]
  linux: [amd64, arm64]
installers:
  - platform: macos
    manager: homebrew
    package_id: oxfmt
    scope: user
    source: homebrew-core
  - platform: linux
    manager: homebrew
    package_id: oxfmt
    scope: user
    source: homebrew-core
