schema_version: 1
id: bun
name: Bun
category: javascript.runtime
description: JavaScript runtime, package manager, test runner, and bundler.
tags: [javascript, typescript, runtime]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [bun]
version_args: [--version]
dependencies: []
conflicts: []
platforms:
  windows: [amd64]
  macos: [amd64, arm64]
  linux: [amd64, arm64]
installers:
  - platform: windows
    manager: winget
    package_id: Oven-sh.Bun
    scope: user
    source: winget
  - platform: macos
    manager: homebrew
    package_id: oven-sh/bun/bun
    scope: user
    source: oven-sh-bun-tap
