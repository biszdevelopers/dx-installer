schema_version: 1
id: ansible
name: Ansible CLI
category: devops.configuration
description: Command-line automation tools for configuration and deployment.
tags: [ansible, devops, automation]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [ansible]
version_args: [--version]
dependencies: []
conflicts: []
platforms:
  macos: [arm64]
  linux: [amd64, arm64]
platform_alternatives:
  windows:
    - tool_id: powershell
      reason: PowerShell scripts provide native Windows automation but do not run Ansible playbooks.
installers:
  - platform: linux
    manager: homebrew
    package_id: ansible
    scope: user
    source: homebrew-core
  - platform: macos
    manager: homebrew
    package_id: ansible
    scope: user
    source: homebrew-core
