schema_version: 1
id: poetry
name: Poetry
category: python.packages
description: Python project and dependency manager.
tags: [python, dependencies, packages, projects]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [poetry]
version_args: [--version]
dependencies: [python]
conflicts: []
platforms:
  macos: [arm64]
  linux: [amd64, arm64]
  windows: [amd64]
installers:
  - platform: windows
    manager: scoop
    package_id: poetry
    scope: user
    source: Scoop Main bucket
    architectures: [amd64]
  - platform: macos
    manager: homebrew
    package_id: poetry
    scope: user
    source: homebrew-core
  - platform: linux
    manager: homebrew
    package_id: poetry
    scope: user
    source: homebrew-core
