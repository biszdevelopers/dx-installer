schema_version: 1
id: rollup
name: Rollup
category: javascript.build
description: JavaScript module bundler.
tags: [javascript, typescript, bundler]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [rollup]
version_args: [--version]
dependencies: [nodejs-lts]
conflicts: []
platforms:
  windows: [amd64, arm64]
  macos: [amd64, arm64]
  linux: [amd64, arm64]
installers:
  - platform: macos
    manager: homebrew
    package_id: rollup
    scope: user
    source: homebrew-core
  - platform: linux
    manager: homebrew
    package_id: rollup
    scope: user
    source: homebrew-core
registry_installers:
  - platform: windows
    ecosystem: npm
    package_id: rollup
    version: 4.66.0
    scope: user
    source: https://registry.npmjs.org/
  - platform: macos
    ecosystem: npm
    package_id: rollup
    version: 4.66.0
    scope: user
    source: https://registry.npmjs.org/
  - platform: linux
    ecosystem: npm
    package_id: rollup
    version: 4.66.0
    scope: user
    source: https://registry.npmjs.org/
