schema_version: 1
id: rollup
name: Rollup
category: javascript.build
description: JavaScript module bundler.
tags: [javascript, typescript, bundler]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [rollup]
version_args: [--version]
dependencies: [nodejs-lts]
conflicts: []
platforms:
  macos: [arm64]
  linux: [amd64, arm64]
installers:
  - platform: macos
    manager: homebrew
    package_id: rollup
    scope: user
    source: homebrew-core
  - platform: linux
    manager: homebrew
    package_id: rollup
    scope: user
    source: homebrew-core
