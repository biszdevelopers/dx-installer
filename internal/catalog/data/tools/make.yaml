schema_version: 1
id: make
name: GNU Make
category: cpp.build-system
description: GNU Make build automation tool.
tags: [c, cpp, build]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [gmake]
version_args: [--version]
dependencies: []
conflicts: []
platforms:
  macos: [arm64]
  linux: [amd64, arm64]
  windows: [amd64]
installers:
  - platform: windows
    manager: scoop
    package_id: make
    scope: user
    source: Scoop Main bucket
    architectures: [amd64]
  - platform: macos
    manager: homebrew
    package_id: make
    scope: user
    source: homebrew-core
  - platform: linux
    manager: homebrew
    package_id: make
    scope: user
    source: homebrew-core
