schema_version: 1
id: pnpm
name: pnpm
category: javascript.package-manager
description: Fast, disk space-efficient package manager for JavaScript and Node.js projects.
tags: [javascript, nodejs, package-manager]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [pnpm]
version_args: [--version]
dependencies: [nodejs-lts]
conflicts: []
platforms:
  macos: [amd64, arm64]
  windows: [amd64, arm64]
  linux: [amd64, arm64]
installers:
  - platform: windows
    manager: scoop
    package_id: pnpm
    scope: user
    source: Scoop Main bucket
    architectures: [amd64, arm64]
  - platform: macos
    manager: homebrew
    package_id: pnpm
    scope: user
    source: homebrew-core
registry_installers:
  - platform: windows
    ecosystem: npm
    package_id: pnpm
    version: 12.18.0
    scope: user
    source: https://registry.npmjs.org/
  - platform: macos
    ecosystem: npm
    package_id: pnpm
    version: 12.18.0
    scope: user
    source: https://registry.npmjs.org/
  - platform: linux
    ecosystem: npm
    package_id: pnpm
    version: 12.18.0
    scope: user
    source: https://registry.npmjs.org/
