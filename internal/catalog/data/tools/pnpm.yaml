schema_version: 1
id: pnpm
name: pnpm
category: javascript.package-manager
description: Fast, disk space-efficient package manager for JavaScript and Node.js projects.
tags: [javascript, nodejs, package-manager]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [pnpm]
version_args: [--version]
dependencies: [nodejs-lts]
conflicts: []
platforms:
  macos: [amd64, arm64]
installers:
  - platform: macos
    manager: homebrew
    package_id: pnpm
    scope: user
    source: homebrew-core
