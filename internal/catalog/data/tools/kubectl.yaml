schema_version: 1
id: kubectl
name: kubectl
category: infrastructure.kubernetes
description: Command-line client for Kubernetes clusters.
tags: [kubernetes, containers, infrastructure, devops]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [kubectl]
version_args: [version, --client]
dependencies: []
conflicts: []
platforms:
  windows: [amd64]
  macos: [amd64, arm64]
  linux: [amd64, arm64]
installers:
  - platform: windows
    manager: winget
    package_id: Kubernetes.kubectl
    scope: user
    source: winget
  - platform: windows
    manager: scoop
    package_id: kubectl
    scope: user
    source: scoop-bucket
  - platform: windows
    manager: chocolatey
    package_id: kubernetes-cli
    scope: system
    source: configured-chocolatey-source
  - platform: macos
    manager: homebrew
    package_id: kubernetes-cli
    scope: user
    source: homebrew-core
  - platform: linux
    manager: apt
    package_id: kubectl
    scope: system
    source: configured-apt-repositories
