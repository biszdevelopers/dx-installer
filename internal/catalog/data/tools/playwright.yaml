schema_version: 1
id: playwright
name: Playwright
category: javascript.testing
description: Cross-browser automation and test runner for web applications.
tags: [javascript, testing, browser-automation]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [playwright]
version_args: [--version]
dependencies: [nodejs-lts]
conflicts: []
platforms:
  windows: [amd64, arm64]
  macos: [amd64, arm64]
  linux: [amd64, arm64]
registry_installers:
  - platform: windows
    ecosystem: npm
    package_id: playwright
    version: 1.64.1
    scope: user
    source: https://registry.npmjs.org/
  - platform: macos
    ecosystem: npm
    package_id: playwright
    version: 1.64.1
    scope: user
    source: https://registry.npmjs.org/
  - platform: linux
    ecosystem: npm
    package_id: playwright
    version: 1.64.1
    scope: user
    source: https://registry.npmjs.org/
