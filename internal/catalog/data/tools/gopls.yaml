schema_version: 1
id: gopls
name: gopls
category: go.development
description: Official language server for Go.
tags: [go, language-server, editor]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [gopls]
version_args: [version]
dependencies: [go]
conflicts: []
platforms:
  windows: [amd64, arm64]
  macos: [amd64, arm64]
  linux: [amd64, arm64]
installers:
  - platform: macos
    manager: homebrew
    package_id: gopls
    scope: user
    source: homebrew-core
  - platform: linux
    manager: homebrew
    package_id: gopls
    scope: user
    source: homebrew-core
registry_installers:
  - platform: windows
    ecosystem: go-modules
    package_id: golang.org/x/tools/gopls
    version: v0.24.0
    scope: user
    source: https://proxy.golang.org
  - platform: macos
    ecosystem: go-modules
    package_id: golang.org/x/tools/gopls
    version: v0.24.0
    scope: user
    source: https://proxy.golang.org
  - platform: linux
    ecosystem: go-modules
    package_id: golang.org/x/tools/gopls
    version: v0.24.0
    scope: user
    source: https://proxy.golang.org
