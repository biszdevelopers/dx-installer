schema_version: 1
id: pipx
name: pipx
category: python.package-manager
description: Installs and runs Python applications in isolated environments.
tags: [python, package-management, isolation]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [pipx]
version_args: [--version]
dependencies: [python, uv]
conflicts: []
platforms:
  windows: [amd64, arm64]
  macos: [amd64, arm64]
  linux: [amd64, arm64]
registry_installers:
  - platform: windows
    ecosystem: pypi
    package_id: pipx
    version: 1.17.6
    scope: user
    source: https://pypi.org/simple/
  - platform: macos
    ecosystem: pypi
    package_id: pipx
    version: 1.17.6
    scope: user
    source: https://pypi.org/simple/
  - platform: linux
    ecosystem: pypi
    package_id: pipx
    version: 1.17.6
    scope: user
    source: https://pypi.org/simple/