schema_version: 1
id: erlang
name: Erlang/OTP
category: erlang.runtime
description: Concurrent programming language and runtime for distributed systems.
tags: [erlang, otp, distributed-systems]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [erl]
version_args: [-version]
dependencies: []
conflicts: []
platforms:
  macos: [amd64, arm64]
  linux: [amd64, arm64]
installers:
  - platform: macos
    manager: homebrew
    package_id: erlang
    scope: user
    source: homebrew-core
  - platform: linux
    manager: apt
    package_id: erlang-base
    scope: system
    source: configured-apt-repositories
