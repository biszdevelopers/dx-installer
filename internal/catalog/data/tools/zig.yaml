schema_version: 1
id: zig
name: Zig
category: zig.compiler
description: Systems programming language designed for robustness and cross-compilation.
tags: [zig, systems, compiler]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [zig]
version_args: [version]
dependencies: []
conflicts: []
platforms:
  macos: [arm64]
  linux: [amd64, arm64]
  windows: [amd64, arm64]
installers:
  - platform: windows
    manager: scoop
    package_id: zig
    scope: user
    source: Scoop Main bucket
    architectures: [amd64, arm64]
  - platform: macos
    manager: homebrew
    package_id: zig
    scope: user
    source: homebrew-core
  - platform: linux
    manager: homebrew
    package_id: zig
    scope: user
    source: homebrew-core
