schema_version: 1
id: git
name: Git
category: vcs.client
description: Distributed version control for source code.
tags: [version-control, source]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [git]
version_args: [--version]
dependencies: []
conflicts: []
platforms:
  windows: [amd64, arm64]
  macos: [amd64, arm64]
  linux: [amd64, arm64]
  bsd: [amd64, arm64]
installers:
  - platform: windows
    manager: winget
    package_id: Git.Git
    scope: user
    source: winget
  - platform: windows
    manager: scoop
    package_id: git
    scope: user
    source: scoop-bucket
  - platform: windows
    manager: chocolatey
    package_id: git
    scope: system
    source: chocolatey-community
  - platform: macos
    manager: homebrew
    package_id: git
    scope: user
    source: homebrew-core
  - platform: macos
    manager: macports
    package_id: git
    scope: system
    source: macports-ports
  - platform: linux
    manager: apt
    package_id: git
    scope: system
    source: configured-apt-repositories
  - platform: linux
    manager: dnf
    package_id: git
    scope: system
    source: configured-dnf-repositories
  - platform: linux
    manager: pacman
    package_id: git
    scope: system
    source: configured-pacman-repositories
  - platform: linux
    manager: zypper
    package_id: git
    scope: system
    source: configured-zypper-repositories
  - platform: linux
    manager: apk
    package_id: git
    scope: system
    source: configured-apk-repositories
  - platform: bsd
    manager: freebsd-pkg
    package_id: git
    scope: system
    source: configured-freebsd-repository
