schema_version: 1
id: delve
name: Delve
category: go.debugging
description: Debugger for Go programs.
tags: [go, debugger]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [dlv]
version_args: [version]
dependencies: [go]
conflicts: []
platforms:
  windows: [amd64]
  macos: [amd64, arm64]
  linux: [amd64, arm64]
installers:
  - platform: macos
    manager: homebrew
    package_id: delve
    scope: user
    source: homebrew-core
  - platform: linux
    manager: homebrew
    package_id: delve
    scope: user
    source: homebrew-core
registry_installers:
  - platform: windows
    ecosystem: go-modules
    package_id: github.com/go-delve/delve/cmd/dlv
    version: v1.27.2
    scope: user
    source: https://proxy.golang.org
  - platform: macos
    ecosystem: go-modules
    package_id: github.com/go-delve/delve/cmd/dlv
    version: v1.27.2
    scope: user
    source: https://proxy.golang.org
  - platform: linux
    ecosystem: go-modules
    package_id: github.com/go-delve/delve/cmd/dlv
    version: v1.27.2
    scope: user
    source: https://proxy.golang.org
