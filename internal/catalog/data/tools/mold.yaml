schema_version: 1
id: mold
name: mold
category: cpp.linker
description: Modern linker for supported ELF development toolchains.
tags: [c, cpp, linker, linux]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [mold]
version_args: [--version]
dependencies: []
conflicts: []
platforms:
  macos: [arm64]
  linux: [amd64, arm64]
  windows: [amd64]
installers:
  - platform: windows
    manager: scoop
    package_id: mold
    scope: user
    source: Scoop Main bucket
    architectures: [amd64]
  - platform: macos
    manager: homebrew
    package_id: mold
    scope: user
    source: homebrew-core
  - platform: linux
    manager: homebrew
    package_id: mold
    scope: user
    source: homebrew-core
