schema_version: 1
id: ruff
name: Ruff
category: python.quality
description: Fast Python linter and formatter.
tags: [python, linter, formatter]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [ruff]
version_args: [--version]
dependencies: []
conflicts: []
platforms:
  macos: [arm64]
  linux: [amd64, arm64]
  windows: [amd64, arm64]
installers:
  - platform: windows
    manager: scoop
    package_id: ruff
    scope: user
    source: Scoop Main bucket
    architectures: [amd64, arm64]
  - platform: macos
    manager: homebrew
    package_id: ruff
    scope: user
    source: homebrew-core
  - platform: linux
    manager: homebrew
    package_id: ruff
    scope: user
    source: homebrew-core
