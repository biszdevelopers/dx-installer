schema_version: 1
id: conan
name: Conan
category: cpp.packages
description: C and C++ package manager.
tags: [c, cpp, dependencies, packages]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [conan]
version_args: [--version]
dependencies: [python, uv]
conflicts: []
platforms:
  windows: [amd64, arm64]
  macos: [amd64, arm64]
  linux: [amd64, arm64]
installers:
  - platform: macos
    manager: homebrew
    package_id: conan
    scope: user
    source: homebrew-core
  - platform: linux
    manager: homebrew
    package_id: conan
    scope: user
    source: homebrew-core
registry_installers:
  - platform: windows
    ecosystem: pypi
    package_id: conan
    version: 2.33.0
    scope: user
    source: https://pypi.org/simple/
  - platform: macos
    ecosystem: pypi
    package_id: conan
    version: 2.33.0
    scope: user
    source: https://pypi.org/simple/
  - platform: linux
    ecosystem: pypi
    package_id: conan
    version: 2.33.0
    scope: user
    source: https://pypi.org/simple/
