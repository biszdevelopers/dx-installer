schema_version: 1
id: nx
name: Nx
category: javascript.build
description: Extensible build system for JavaScript and TypeScript monorepos.
tags: [javascript, typescript, monorepo, build]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [nx]
version_args: [--version]
dependencies: [nodejs-lts]
conflicts: []
platforms:
  windows: [amd64, arm64]
  macos: [amd64, arm64]
  linux: [amd64, arm64]
installers:
  - platform: macos
    manager: homebrew
    package_id: nx
    scope: user
    source: homebrew-core
  - platform: linux
    manager: homebrew
    package_id: nx
    scope: user
    source: homebrew-core
registry_installers:
  - platform: windows
    ecosystem: npm
    package_id: nx
    version: 24.0.3
    scope: user
    source: https://registry.npmjs.org/
  - platform: macos
    ecosystem: npm
    package_id: nx
    version: 24.0.3
    scope: user
    source: https://registry.npmjs.org/
  - platform: linux
    ecosystem: npm
    package_id: nx
    version: 24.0.3
    scope: user
    source: https://registry.npmjs.org/
