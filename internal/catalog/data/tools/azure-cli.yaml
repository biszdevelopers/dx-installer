schema_version: 1
id: azure-cli
name: Azure CLI
category: devops.cloud
description: Official command-line interface for Microsoft Azure.
tags: [azure, cloud, devops]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [az]
version_args: [--version]
dependencies: []
conflicts: []
platforms:
  macos: [amd64, arm64]
  windows: [amd64]
  linux: [amd64, arm64]
installers:
  - platform: windows
    manager: scoop
    package_id: azure-cli
    scope: user
    source: Scoop Main bucket
    architectures: [amd64]
  - platform: macos
    manager: homebrew
    package_id: azure-cli
    kind: cask
    scope: user
    source: homebrew-cask
  - platform: linux
    manager: homebrew
    package_id: azure-cli
    kind: cask
    scope: user
    source: homebrew-cask
    architectures: [amd64, arm64]
