schema_version: 1
id: gql
name: GraphQL CLI
category: api.graphql
description: Python GraphQL client CLI with HTTP and WebSocket transports for querying GraphQL services.
tags: [graphql, api, client, protocol]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [gql]
version_args: [--version]
dependencies: [python, uv]
conflicts: []
platforms:
  windows: [amd64, arm64]
  macos: [amd64, arm64]
  linux: [amd64, arm64]
registry_installers:
  - platform: windows
    ecosystem: pypi
    package_id: 'gql[all]'
    version: 4.4.0
    scope: user
    source: https://pypi.org/simple/
  - platform: macos
    ecosystem: pypi
    package_id: 'gql[all]'
    version: 4.4.0
    scope: user
    source: https://pypi.org/simple/
  - platform: linux
    ecosystem: pypi
    package_id: 'gql[all]'
    version: 4.4.0
    scope: user
    source: https://pypi.org/simple/
