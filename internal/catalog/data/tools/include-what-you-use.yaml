schema_version: 1
id: include-what-you-use
name: Include What You Use
category: cpp.analysis
description: Analyzes C and C++ includes and suggests direct dependencies.
tags: [c, cpp, static-analysis]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [include-what-you-use]
version_args: [--version]
dependencies: [clang]
conflicts: []
platforms:
  macos: [arm64]
  linux: [amd64, arm64]
installers:
  - platform: macos
    manager: homebrew
    package_id: include-what-you-use
    scope: user
    source: homebrew-core
  - platform: linux
    manager: homebrew
    package_id: include-what-you-use
    scope: user
    source: homebrew-core
