schema_version: 1
id: swift
name: Swift
category: swift.compiler
description: Swift compiler and Swift Package Manager toolchain.
tags: [swift, compiler, mobile, package-manager]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [swift, swiftc, swift-package]
version_args: [--version]
dependencies: []
conflicts: []
platforms:
  macos: [amd64, arm64]
  linux: [amd64, arm64]
  windows: [amd64, arm64]
installers:
  - platform: windows
    manager: scoop
    package_id: swift
    scope: user
    source: Scoop Main bucket
    architectures: [amd64, arm64]
  - platform: macos
    manager: homebrew
    package_id: swift
    scope: user
    source: homebrew-core
  - platform: linux
    manager: homebrew
    package_id: swift
    scope: user
    source: homebrew-core
    architectures: [amd64, arm64]
