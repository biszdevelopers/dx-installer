schema_version: 1
id: lldb
name: LLDB
category: cpp.debugger
description: LLVM's next-generation debugger for native applications.
tags: [c, cpp, debugger, llvm]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [lldb]
version_args: [--version]
dependencies: []
conflicts: []
platforms:
  windows: [amd64, arm64]
  macos: [amd64, arm64]
  linux: [amd64, arm64]
installers:
  - platform: windows
    manager: scoop
    package_id: llvm
    scope: user
    source: Scoop Main bucket
    architectures: [amd64, arm64]
  - platform: macos
    manager: homebrew
    package_id: llvm
    scope: user
    source: homebrew-core
  - platform: linux
    manager: apt
    package_id: lldb
    scope: system
    source: configured-apt-repositories
  - platform: linux
    manager: dnf
    package_id: lldb
    scope: system
    source: configured-dnf-repositories
  - platform: linux
    manager: pacman
    package_id: lldb
    scope: system
    source: configured-pacman-repositories
