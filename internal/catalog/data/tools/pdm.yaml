schema_version: 1
id: pdm
name: PDM
category: python.packages
description: Python package and project manager supporting current packaging standards.
tags: [python, dependencies, packages, projects]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [pdm]
version_args: [--version]
dependencies: [python, uv]
conflicts: []
platforms:
  windows: [amd64, arm64]
  macos: [amd64, arm64]
  linux: [amd64, arm64]
installers:
  - platform: macos
    manager: homebrew
    package_id: pdm
    scope: user
    source: homebrew-core
  - platform: linux
    manager: homebrew
    package_id: pdm
    scope: user
    source: homebrew-core
registry_installers:
  - platform: windows
    ecosystem: pypi
    package_id: pdm
    version: 2.29.7
    scope: user
    source: https://pypi.org/simple/
  - platform: macos
    ecosystem: pypi
    package_id: pdm
    version: 2.29.7
    scope: user
    source: https://pypi.org/simple/
  - platform: linux
    ecosystem: pypi
    package_id: pdm
    version: 2.29.7
    scope: user
    source: https://pypi.org/simple/
