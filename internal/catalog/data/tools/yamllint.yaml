schema_version: 1
id: yamllint
name: yamllint
category: security.configuration
description: Linter for YAML files and configuration quality.
tags: [yaml, lint, configuration, quality]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [yamllint]
version_args: [--version]
dependencies: [python, uv]
conflicts: []
platforms:
  windows: [amd64, arm64]
  macos: [amd64, arm64]
  linux: [amd64, arm64]
registry_installers:
  - platform: windows
    ecosystem: pypi
    package_id: yamllint
    version: 1.38.0
    scope: user
    source: https://pypi.org/simple/
  - platform: macos
    ecosystem: pypi
    package_id: yamllint
    version: 1.38.0
    scope: user
    source: https://pypi.org/simple/
  - platform: linux
    ecosystem: pypi
    package_id: yamllint
    version: 1.38.0
    scope: user
    source: https://pypi.org/simple/
