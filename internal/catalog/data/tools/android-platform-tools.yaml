schema_version: 1
id: android-platform-tools
name: Android Platform Tools
category: mobile.android
description: Google Android Debug Bridge and Fastboot utilities installed as the standalone SDK platform-tools component.
tags: [android, sdk, mobile, adb, fastboot]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [adb, fastboot]
version_args: [--version]
dependencies: [android-sdk-command-line-tools]
conflicts: []
platforms:
  windows: [amd64]
  macos: [amd64, arm64]
  linux: [amd64]
installers:
  - platform: windows
    manager: android-sdk
    package_id: platform-tools
    scope: user
    source: google-android-sdk (interactive license prompt)
    path_entries: [platform-tools]
    approximate_size: 15728640
  - platform: macos
    manager: android-sdk
    package_id: platform-tools
    scope: user
    source: google-android-sdk (interactive license prompt)
    path_entries: [platform-tools]
    approximate_size: 15728640
  - platform: linux
    manager: android-sdk
    package_id: platform-tools
    scope: user
    source: google-android-sdk (interactive license prompt)
    path_entries: [platform-tools]
    approximate_size: 15728640
