schema_version: 1
id: dart
name: Dart
category: dart.runtime
description: Dart language SDK with a virtual machine and JavaScript compiler.
tags: [dart, mobile, web]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [dart]
version_args: [--version]
dependencies: []
conflicts: []
platforms:
  macos: [amd64, arm64]
  windows: [amd64, arm64]
  linux: [amd64, arm64]
installers:
  - platform: windows
    manager: scoop
    package_id: dart
    scope: user
    source: Scoop Main bucket
    architectures: [amd64]
  - platform: macos
    manager: homebrew
    package_id: dart-lang/dart/dart
    scope: user
    source: dart-lang/dart official Homebrew tap
  - platform: linux
    manager: homebrew
    package_id: dart-sdk
    scope: user
    source: homebrew-core
    architectures: [amd64, arm64]
  - platform: windows
    manager: winget
    package_id: Google.DartSDK
    scope: user
    source: winget portable archive
    architectures: [arm64]
