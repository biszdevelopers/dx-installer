schema_version: 1
id: maven
name: Apache Maven
category: java.build-system
description: Java-based project management and build automation tool.
tags: [java, jvm, build, dependency-management]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [mvn]
version_args: [--version]
dependencies: []
conflicts: []
platforms:
  windows: [amd64]
  macos: [amd64, arm64]
  linux: [amd64, arm64]
installers:
  - platform: windows
    manager: scoop
    package_id: maven
    scope: user
    source: scoop-main
  - platform: windows
    manager: chocolatey
    package_id: maven
    scope: system
    source: configured-chocolatey-source
  - platform: macos
    manager: homebrew
    package_id: maven
    scope: user
    source: homebrew-core
  - platform: linux
    manager: apt
    package_id: maven
    scope: system
    source: configured-apt-repositories
  - platform: linux
    manager: dnf
    package_id: maven
    scope: system
    source: configured-dnf-repositories
  - platform: linux
    manager: pacman
    package_id: maven
    scope: system
    source: configured-pacman-repositories
