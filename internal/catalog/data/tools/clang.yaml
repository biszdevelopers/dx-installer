schema_version: 1
id: clang
name: Clang
category: cpp.compiler
description: LLVM C and C++ compiler front ends.
tags: [c, cpp, compiler, llvm]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [clang, clang++]
version_args: [--version]
dependencies: []
conflicts: []
platforms:
  windows: [amd64, arm64]
  macos: [amd64, arm64]
  linux: [amd64, arm64]
  bsd: [amd64, arm64]
installers:
  - platform: windows
    manager: winget
    package_id: LLVM.LLVM
    scope: system
    source: winget
  - platform: windows
    manager: scoop
    package_id: llvm
    scope: user
    source: scoop-bucket
  - platform: macos
    manager: homebrew
    package_id: llvm
    scope: user
    source: homebrew-core
  - platform: linux
    manager: apt
    package_id: clang
    scope: system
    source: configured-apt-repositories
  - platform: linux
    manager: dnf
    package_id: clang
    scope: system
    source: configured-dnf-repositories
  - platform: linux
    manager: pacman
    package_id: clang
    scope: system
    source: configured-pacman-repositories
  - platform: linux
    manager: zypper
    package_id: clang
    scope: system
    source: configured-zypper-repositories
  - platform: linux
    manager: apk
    package_id: clang
    scope: system
    source: configured-apk-repositories
  - platform: bsd
    manager: freebsd-pkg
    package_id: llvm
    scope: system
    source: configured-freebsd-repository
