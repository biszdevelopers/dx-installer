schema_version: 1
id: powershell
name: PowerShell
category: shell.runtime
description: Cross-platform automation shell and scripting runtime.
tags: [shell, automation, scripting]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [pwsh]
version_args: [-Version]
dependencies: []
conflicts: []
platforms:
  windows: [amd64, arm64]
  macos: [amd64, arm64]
  linux: [amd64, arm64]
installers:
  - platform: windows
    manager: winget
    package_id: Microsoft.PowerShell
    scope: user
    source: winget
  - platform: macos
    manager: homebrew
    package_id: powershell
    kind: cask
    scope: user
    source: homebrew-cask
