schema_version: 1
id: mdbook
name: mdBook
category: documentation.books
description: Build documentation books from Markdown source.
tags: [documentation, markdown, books]
version:
  channel: stable
  upgrade_policy: never_automatically
executables: [mdbook]
version_args: [--version]
dependencies: []
conflicts: []
platforms:
  macos: [amd64, arm64]
  linux: [amd64, arm64]
installers:
  - platform: macos
    manager: homebrew
    package_id: mdbook
    scope: user
    source: homebrew-core
  - platform: linux
    manager: homebrew
    package_id: mdbook
    scope: user
    source: homebrew-core
